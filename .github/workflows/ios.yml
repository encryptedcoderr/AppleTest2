name: iOS JPEG Fuzzer Workflow

on:
  # This allows you to run the workflow manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  fuzz-and-log-ios:
    name: Generate Malicious JPEG and Log Simulator Response
    # This must run on a macOS runner to get access to Xcode and the iOS Simulator
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          # This ensures your Python script is available to the workflow
          path: main

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: 4. Generate Malicious JPEGs
        id: generate_jpegs
        working-directory: ./main
        run: |
          # Run your script to create the JPEGs in its output directory
          python MaliciousJPEGGenerator.py
          
          # List all generated JPEGs for individual opening
          JPEGS=$(ls malicious_jpegs/exploit_*.jpg | tr '\n' ' ')
          echo "jpeg_list=${JPEGS}" >> "$GITHUB_OUTPUT"
          echo "output_dir=malicious_jpegs" >> "$GITHUB_OUTPUT"

      - name: 5. Fuzz Simulator and Capture Log
        id: fuzz_ios
        working-directory: ./main
        run: |
          set -euo pipefail  # FIXED: Strict error handling
          JPEG_LIST="${{ steps.generate_jpegs.outputs.jpeg_list }}"
          LOG_FILE="ios_simulator_errors.log"  # Renamed for errors (not just crashes)

          # FIXED: Install coreutils and jq for gtimeout and JSON parsing
          brew install coreutils jq

          echo "--- Finding an available iPhone simulator ---"
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | .[] | .[] | select(.isAvailable == true and (.name? | startswith("iPhone") // false)) | .udid' | head -n 1)
          
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "--- No available simulators found. Full JSON debug: ---"
            xcrun simctl list devices available -j
            echo "--- Booting first iPhone simulator as fallback ---"
            SIMULATOR_UDID=$(xcrun simctl list devices -j | jq -r '.devices | .[] | .[] | select(.name? | startswith("iPhone") // false) | .udid' | head -n 1)
            if [ -z "$SIMULATOR_UDID" ]; then
              echo "::error::No iPhone simulators found at all."
              exit 1
            fi
            echo "Selected fallback UDID: ${SIMULATOR_UDID}"
            xcrun simctl boot "${SIMULATOR_UDID}"
            # Poll boot until "Finished"
            echo "--- Monitoring boot until complete (up to 120s) ---"
            BOOT_TIMEOUT=120
            BOOT_ELAPSED=0
            while [ $BOOT_ELAPSED -lt $BOOT_TIMEOUT ]; do
              BOOT_STATUS=$(xcrun simctl bootstatus "${SIMULATOR_UDID}" | grep -E "(Status|Finished)")
              if echo "$BOOT_STATUS" | grep -q "Status=4294967295\|Finished"; then
                echo "--- Boot complete! ---"
                break
              fi
              sleep 5
              BOOT_ELAPSED=$((BOOT_ELAPSED + 5))
              echo "--- Boot progress: $BOOT_ELAPSED s ---"
            done
            if [ $BOOT_ELAPSED -ge $BOOT_TIMEOUT ]; then
              echo "::warning::Boot timed out; proceeding."
            fi
          else
            echo "--- Booting available simulator (UDID: ${SIMULATOR_UDID}) ---"
            xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
            sleep 10
          fi

          # Upload all JPEGs to Photos library
          echo "--- Uploading all malicious JPEGs to simulator's Photos library ---"
          for jpeg in $JPEG_LIST; do
            xcrun simctl addmedia "${SIMULATOR_UDID}" "$jpeg"
            echo "Uploaded: $jpeg"
          done

          echo "--- Starting system log capture (broader for errors) ---"
          # FIXED: Valid predicate (removed invalid eventType == faultEvent; kept messageType for faults/errors); added --info --debug
          PREDICATE='subsystem == "com.apple.photos" OR process == "MobileSlideShow" OR messageType == fault OR messageType == error OR eventMessage CONTAINS "JPEG" OR eventMessage CONTAINS "decode"'
          gtimeout 120s xcrun simctl spawn "${SIMULATOR_UDID}" log stream --info --debug --predicate "$PREDICATE" > "$LOG_FILE" &
          LOG_PID=$!
          
          sleep 5 # Logger init

          echo "--- Launching Photos app ---"
          xcrun simctl launch "${SIMULATOR_UDID}" com.apple.mobileslideshow
          sleep 10  # Let app load

          # FIXED: Replace AppleScript loop with URL scheme to Recents (triggers decode in simulator Photos app; no heredoc issues)
          echo "--- Opening Recents in Photos app to trigger decode for all JPEGs ---"
          NUM_JPEGS=$(echo $JPEG_LIST | wc -w)
          PROCESS_DELAY=$((NUM_JPEGS * 5 + 30))  # 5s per JPEG + buffer
          xcrun simctl openurl "${SIMULATOR_UDID}" "photos-redirect://" || echo "URL scheme failed; relying on app launch + delay"
          sleep $PROCESS_DELAY  # Time for batch decode in Recents

          echo "--- Waiting additional time for reliable logging ---"
          sleep 60  # Buffer for errors

          echo "--- Stopping log capture ---"
          kill "$LOG_PID" 2>/dev/null || true

          echo "--- Shutting down the simulator ---"
          xcrun simctl shutdown "${SIMULATOR_UDID}"

          echo "--- Log capture complete. Log content: ---"
          if [ -f "$LOG_FILE" ]; then
            cat "$LOG_FILE"
            # FIXED: If empty, check system logs with valid predicate (15m window)
            if [ ! -s "$LOG_FILE" ]; then
              echo "--- No logs from stream; checking system logs for JPEG errors ---"
              log show --predicate 'eventMessage CONTAINS "JPEG" OR eventMessage CONTAINS "Photos" OR eventMessage CONTAINS "decode" OR eventMessage CONTAINS "MobileSlideShow" OR messageType == fault OR messageType == error' --last 15m --info --debug --style syslog | head -100
            fi
          else
            echo "No log file generated."
            log show --predicate 'eventMessage CONTAINS "JPEG" OR eventMessage CONTAINS "Photos" OR messageType == fault OR messageType == error' --last 15m --info --debug --style syslog | head -100
          fi
          
          # Set paths as outputs for the artifact upload step
          echo "log_path=${LOG_FILE}" >> "$GITHUB_OUTPUT"
          echo "jpeg_dir=${{ steps.generate_jpegs.outputs.output_dir }}" >> "$GITHUB_OUTPUT"

      - name: 6. Upload Fuzzing Artifacts
        # This step runs even if a previous step fails, ensuring you always get the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-fuzzing-results-${{ github.run_id }}
          path: |
            main/${{ steps.fuzz_ios.outputs.jpeg_dir }}
            main/${{ steps.fuzz_ios.outputs.log_path }}
