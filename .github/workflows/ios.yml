name: iOS JPEG Trace Analysis Workflow

on:
  workflow_dispatch:
    inputs:
      fuzzing_run_id:
        description: 'GitHub Actions Run ID of the fuzzing workflow to analyze'
        required: true
        type: string
      artifact_id:
        description: 'Artifact ID of the ios-fuzzing-results artifact'
        required: true
        type: string

jobs:
  analyze-trace:
    name: Analyze Instruments Trace and Correlate with Logs
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          path: main

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 4. Download Fuzzing Artifact
        id: download_artifact
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          RUN_ID="${{ github.event.inputs.fuzzing_run_id }}"
          ARTIFACT_ID="${{ github.event.inputs.artifact_id }}"
          ARTIFACT_NAME="ios-fuzzing-results-${RUN_ID}"
          OUTPUT_DIR="fuzzing_artifacts"
          
          echo "--- Downloading artifact ${ARTIFACT_NAME} (ID: ${ARTIFACT_ID}) ---"
          mkdir -p "${OUTPUT_DIR}"
          ARTIFACT_URL="https://api.github.com/repos/${{ github.repository }}/actions/artifacts/${ARTIFACT_ID}/zip"
          
          curl -L -H "Authorization: Bearer ${GITHUB_TOKEN}" "${ARTIFACT_URL}" -o "${OUTPUT_DIR}/artifacts.zip"
          
          echo "--- Verifying artifact SHA256 ---"
          EXPECTED_SHA256="3a1a86ec5cdd8d3a40d19a52974204e81d921a5fa750b7f30ac5ce3a7ac1f06e"
          ACTUAL_SHA256=$(shasum -a 256 "${OUTPUT_DIR}/artifacts.zip" | awk '{print $1}')
          if [ "${ACTUAL_SHA256}" != "${EXPECTED_SHA256}" ]; then
            echo "::error::Artifact SHA256 mismatch. Expected: ${EXPECTED_SHA256}, Actual: ${ACTUAL_SHA256}"
            exit 1
          fi
          
          unzip -q "${OUTPUT_DIR}/artifacts.zip" -d "${OUTPUT_DIR}"
          
          echo "--- Listing artifact contents for debugging ---"
          find "${OUTPUT_DIR}" -type f -ls
          
          echo "artifact_dir=${OUTPUT_DIR}/main" >> "$GITHUB_OUTPUT"

      - name: 5. Analyze Instruments Trace
        id: analyze_trace
        working-directory: ./main
        run: |
          set -euo pipefail
          ARTIFACT_DIR="${{ steps.download_artifact.outputs.artifact_dir }}"
          TRACE_DIR="${ARTIFACT_DIR}/instruments_trace"
          LOG_FILE="${ARTIFACT_DIR}/ios_simulator_errors.log"
          NDJSON_FILE="${ARTIFACT_DIR}/ios_simulator_ndjson.log"
          JPEG_MAPPING="${ARTIFACT_DIR}/jpeg_mapping.txt"
          OUTPUT_DIR="trace_analysis"
          TRACE_REPORT="${OUTPUT_DIR}/trace_report.json"
          SUMMARY_FILE="${OUTPUT_DIR}/analysis_summary.txt"

          brew install jq

          echo "--- Locating trace folder ---"
          TRACE_FOLDER=$(find "${TRACE_DIR}" -type d -name "*.trace" -maxdepth 1 2>/dev/null | head -n 1)
          mkdir -p "${OUTPUT_DIR}"
          : > "${SUMMARY_FILE}"
          echo "Trace Analysis Summary" >> "${SUMMARY_FILE}"
          echo "=====================" >> "${SUMMARY_FILE}"
          echo "Timestamp: $(date -u)" >> "${SUMMARY_FILE}"
          echo "" >> "${SUMMARY_FILE}"

          if [ -n "${TRACE_FOLDER}" ]; then
            echo "Found trace: ${TRACE_FOLDER}" >> "${SUMMARY_FILE}"
            echo "Found trace: ${TRACE_FOLDER}"

            echo "--- Exporting trace data to JSON ---"
            if xcrun xctrace export --input "${TRACE_FOLDER}" --output "${TRACE_REPORT}" --output-type json; then
              echo "--- Analyzing trace for memory spikes and OOM ---"
              MAX_MEMORY=$(jq -r '.trace.tracks[] | select(.name == "Allocations") | .data[] | .statistics | select(.name == "Live Bytes") | .max // 0' "${TRACE_REPORT}" | sort -nr | head -n 1)
              echo "Max Live Bytes: ${MAX_MEMORY} bytes" >> "${SUMMARY_FILE}"
              if [ "${MAX_MEMORY}" -gt 1000000000 ]; then
                echo "::warning::Potential OOM detected: Max Live Bytes exceeds 1GB (${MAX_MEMORY} bytes)"
                echo "Potential OOM: Max Live Bytes = ${MAX_MEMORY} bytes (>1GB)" >> "${SUMMARY_FILE}"
              fi

              MOBILE_SLIDESHOW_ALLOCS=$(jq -r '.trace.tracks[] | select(.name == "Allocations") | .data[] | .allocations[] | select(.process == "MobileSlideShow") | "\(.size) bytes at \(.timestamp)"' "${TRACE_REPORT}" | sort -nr | head -n 10)
              echo "Top 10 MobileSlideShow Allocations (bytes, timestamp):" >> "${SUMMARY_FILE}"
              echo "${MOBILE_SLIDESHOW_ALLOCS}" >> "${SUMMARY_FILE}"
            else
              echo "::warning::Failed to export trace to JSON"
              echo "Trace Export Failed: Could not process ${TRACE_FOLDER}" >> "${SUMMARY_FILE}"
            fi
          else
            echo "::warning::No .trace folder found in ${TRACE_DIR}"
            echo "No trace folder found in ${TRACE_DIR}" >> "${SUMMARY_FILE}"
          fi

          echo "" >> "${SUMMARY_FILE}"

          echo "--- Correlating with logs and JPEG mapping ---"
          if [ -f "${NDJSON_FILE}" ]; then
            echo "Log Errors (from ios_simulator_ndjson.log):" >> "${SUMMARY_FILE}"
            jq -r '. | select(.eventMessage | test("error|EXC|SEGV|Too large image|ImageIO|Tungsten")) | "\(.timestamp) \(.eventMessage)"' "${NDJSON_FILE}" | head -n 20 >> "${SUMMARY_FILE}"
          elif [ -f "${LOG_FILE}" ]; then
            echo "Log Errors (from ios_simulator_errors.log):" >> "${SUMMARY_FILE}"
            grep -E "error|EXC|SEGV|Too large image|ImageIO|Tungsten" "${LOG_FILE}" | head -n 20 >> "${SUMMARY_FILE}"
          else
            echo "No logs found for correlation" >> "${SUMMARY_FILE}"
          fi

          echo "" >> "${SUMMARY_FILE}"

          if [ -f "${JPEG_MAPPING}" ]; then
            echo "JPEG to DCIM Mapping:" >> "${SUMMARY_FILE}"
            cat "${JPEG_MAPPING}" >> "${SUMMARY_FILE}"
          else
            echo "No JPEG mapping file found" >> "${SUMMARY_FILE}"
          fi

          echo "--- Analysis complete. Summary: ---"
          cat "${SUMMARY_FILE}"

          echo "trace_report=${TRACE_REPORT}" >> "$GITHUB_OUTPUT"
          echo "summary_file=${SUMMARY_FILE}" >> "$GITHUB_OUTPUT"
          echo "output_dir=${OUTPUT_DIR}" >> "$GITHUB_OUTPUT"

      - name: 6. Upload Analysis Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trace-analysis-results-${{ github.run_id }}
          path: |
            main/${{ steps.analyze_trace.outputs.output_dir }}
            main/${{ steps.download_artifact.outputs.artifact_dir }}/instruments_trace
            main/${{ steps.download_artifact.outputs.artifact_dir }}/ios_simulator_errors.log
            main/${{ steps.download_artifact.outputs.artifact_dir }}/ios_simulator_ndjson.log
            main/${{ steps.download_artifact.outputs.artifact_dir }}/jpeg_mapping.txt
