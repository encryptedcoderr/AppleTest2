name: iOS JPEG Fuzzer Workflow

on:
  workflow_dispatch:

jobs:
  fuzz-and-log-ios:
    name: Generate Malicious JPEG and Log Simulator Response
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          path: main

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: 4. Generate Malicious JPEGs
        id: generate_jpegs
        working-directory: ./main
        run: |
          python MaliciousJPEGGenerator.py
          
          JPEGS=$(ls malicious_jpegs/exploit_*.jpg | tr '\n' ' ')
          echo "jpeg_list=${JPEGS}" >> "$GITHUB_OUTPUT"
          echo "output_dir=malicious_jpegs" >> "$GITHUB_OUTPUT"

      - name: 5. Fuzz Simulator and Capture Log
        id: fuzz_ios
        working-directory: ./main
        run: |
          set -euo pipefail
          JPEG_LIST="${{ steps.generate_jpegs.outputs.jpeg_list }}"
          LOG_FILE="ios_simulator_errors.log"
          NDJSON_FILE="ios_simulator_ndjson.log"
          INSTR_DIR="instruments_trace"
          JPEG_MAPPING="jpeg_mapping.txt"

          brew install coreutils jq

          echo "--- Finding an available iPhone simulator (iOS 18+) ---"
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | to_entries[] | select(.key | test("iOS-18-[0-9]"; "i")) | .value[] | select(.isAvailable == true and (.name? | startswith("iPhone") // false)) | .udid' | head -n 1)
          
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "--- No iOS 18+ available; fallback to any iPhone ---"
            SIMULATOR_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | .[] | .[] | select(.isAvailable == true and (.name? | startswith("iPhone") // false)) | .udid' | head -n 1)
            if [ -z "$SIMULATOR_UDID" ]; then
              echo "--- No iPhone simulators found. Debug JSON: ---"
              xcrun simctl list devices available -j
              echo "::error::No iPhone simulators found."
              exit 1
            fi
            echo "Selected fallback UDID: ${SIMULATOR_UDID}"
            xcrun simctl boot "${SIMULATOR_UDID}"
            BOOT_TIMEOUT=180
            BOOT_ELAPSED=0
            while [ $BOOT_ELAPSED -lt $BOOT_TIMEOUT ]; do
              BOOT_STATUS=$(xcrun simctl bootstatus "${SIMULATOR_UDID}" 2>/dev/null | grep -E "(Status|Finished)")
              if echo "$BOOT_STATUS" | grep -q "Finished"; then
                echo "--- Boot complete! ---"
                break
              fi
              if [ $BOOT_ELAPSED -ge 150 ]; then
                echo "::warning::Simulator boot taking longer than expected (${BOOT_ELAPSED}s)"
              fi
              sleep 5
              BOOT_ELAPSED=$((BOOT_ELAPSED + 5))
            done
            if [ $BOOT_ELAPSED -ge $BOOT_TIMEOUT ]; then
              echo "::error::Simulator failed to boot within ${BOOT_TIMEOUT}s"
              exit 1
            fi
          else
            xcrun simctl boot "${SIMULATOR_UDID}"
            xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
            sleep 10
          fi
          echo "Using UDID: ${SIMULATOR_UDID}"

          echo "--- Uploading JPEGs and mapping to DCIM ---"
          : > "$JPEG_MAPPING"
          for jpeg in $JPEG_LIST; do
            if OUTPUT=$(xcrun simctl addmedia "${SIMULATOR_UDID}" "$jpeg" 2>&1); then
              echo "Uploaded: $jpeg"
              echo "$jpeg -> $(echo "$OUTPUT" | grep -o 'IMG_[0-9]*\.JPG' || echo "unknown")" >> "$JPEG_MAPPING"
            else
              echo "Upload skipped for $jpeg"
              echo "$jpeg -> skipped" >> "$JPEG_MAPPING"
            fi
          done

          echo "--- Launching Photos app ---"
          LAUNCH_ATTEMPTS=3
          LAUNCH_SUCCESS=0
          for attempt in $(seq 1 $LAUNCH_ATTEMPTS); do
            echo "Launch attempt $attempt of $LAUNCH_ATTEMPTS"
            LAUNCH_OUTPUT=$(xcrun simctl launch "${SIMULATOR_UDID}" com.apple.mobileslideshow 2>&1 || true)
            if echo "$LAUNCH_OUTPUT" | grep -q "com.apple.mobileslideshow:"; then
              APP_PID=$(echo "$LAUNCH_OUTPUT" | awk -F': ' '{print $2}')
              echo "Photos app launched: PID=$APP_PID"
              LAUNCH_SUCCESS=1
              break
            elif echo "$LAUNCH_OUTPUT" | grep -q '^[0-9]+$'; then
              APP_PID="$LAUNCH_OUTPUT"
              echo "Photos app launched: PID=$APP_PID"
              LAUNCH_SUCCESS=1
              break
            fi
            echo "Launch failed: $LAUNCH_OUTPUT"
            sleep 10
          done
          if [ $LAUNCH_SUCCESS -eq 0 ]; then
            echo "::error::Failed to launch Photos app after $LAUNCH_ATTEMPTS attempts"
            exit 1
          fi
          sleep 45  # Delay for first boot

          echo "--- Triggering decode via Photos app ---"
          NUM_JPEGS=$(echo $JPEG_LIST | wc -w)
          PROCESS_DELAY=$((NUM_JPEGS * 10 + 60))  # ~270s for 21 JPEGs
          xcrun simctl openurl "${SIMULATOR_UDID}" "photos-redirect://" || echo "URL open failed, relying on Photos app load"
          sleep 5  # Start decoding before trace

          echo "--- Starting Instruments trace for full execution (OOM detection) ---"
          mkdir -p "${INSTR_DIR}"
          if [ -n "$APP_PID" ]; then
            if ! xcrun xctrace record --template "Allocations" --output "${INSTR_DIR}" --device "${SIMULATOR_UDID}" --attach "$APP_PID" --time-limit 540s --quiet; then
              echo "::warning::Instruments trace failed for PID $APP_PID, trying all-processes fallback"
              xcrun xctrace record --template "Allocations" --output "${INSTR_DIR}" --device "${SIMULATOR_UDID}" --all-processes --time-limit 540s --quiet || echo "::warning::Instruments all-processes trace failed, continuing with log capture"
            fi
          else
            echo "::warning::No PID captured, using all-processes fallback"
            xcrun xctrace record --template "Allocations" --output "${INSTR_DIR}" --device "${SIMULATOR_UDID}" --all-processes --time-limit 540s --quiet || echo "::warning::Instruments all-processes trace failed, continuing with log capture"
          fi
          sleep 5  # Wait for trace to finalize

          echo "--- Starting system log capture (enhanced for ImageIO errors/crashes) ---"
          PREDICATE='subsystem == "com.apple.photos" OR subsystem == "com.apple.imageio" OR process == "MobileSlideShow" OR messageType == error OR eventMessage CONTAINS "JPEG" OR eventMessage CONTAINS "decode" OR eventMessage CONTAINS "ImageIO" OR eventMessage CONTAINS "EXC" OR eventMessage CONTAINS "SEGV" OR eventMessage CONTAINS "Tungsten" AND NOT subsystem == "com.apple.network" AND NOT process == "SpringBoard"'
          gtimeout $((PROCESS_DELAY + 60)) xcrun simctl spawn "${SIMULATOR_UDID}" log stream --level debug --style ndjson --predicate "$PREDICATE" > "$NDJSON_FILE" 2>/dev/null &
          LOG_PID=$!
          
          echo "--- Waiting for JPEG decoding to complete ---"
          sleep $((PROCESS_DELAY - 5))  # Adjust for early openurl

          echo "--- Additional buffer for async faults ---"
          sleep 60

          echo "--- Stopping log/trace capture ---"
          kill "$LOG_PID" 2>/dev/null || true
          sleep 5  # Ensure trace closes

          echo "--- Shutting down simulator ---"
          xcrun simctl shutdown "${SIMULATOR_UDID}" 2>/dev/null || true

          echo "--- Log capture complete. NDJSON content: ---"
          if [ -s "$NDJSON_FILE" ]; then
            cat "$NDJSON_FILE"
          else
            echo "--- No stream logs; fallback search (20m) ---"
            log show --predicate 'eventMessage CONTAINS "JPEG" OR eventMessage CONTAINS "Photos" OR eventMessage CONTAINS "ImageIO" OR eventMessage CONTAINS "decode" OR eventMessage CONTAINS "MobileSlideShow" OR messageType == error OR eventMessage CONTAINS "Tungsten" AND NOT subsystem == "com.apple.network" AND NOT process == "SpringBoard"' --last 20m --info --debug --style syslog | head -200 > "$LOG_FILE"
            cat "$LOG_FILE"
          fi
          
          if log show --predicate 'messageType == error AND (eventMessage CONTAINS "EXC" OR eventMessage CONTAINS "SEGV" OR eventMessage CONTAINS "Too large image")' --last 20m --style syslog | grep -q "EXC\|SEGV\|Too large image"; then
            echo "::warning::Potential crash or OOM detected in faults!"
          fi
          
          if [ -d "${INSTR_DIR}" ] && [ -n "$(ls -A ${INSTR_DIR}/*.trace 2>/dev/null)" ]; then
            echo "Instruments trace generated: $(ls ${INSTR_DIR}/*.trace)"
          else
            echo "::warning::No Instruments trace files generated"
          fi
          
          echo "log_path=${LOG_FILE}" >> "$GITHUB_OUTPUT"
          echo "ndjson_path=${NDJSON_FILE}" >> "$GITHUB_OUTPUT"
          echo "instr_path=${INSTR_DIR}" >> "$GITHUB_OUTPUT"
          echo "jpeg_mapping=${JPEG_MAPPING}" >> "$GITHUB_OUTPUT"

      - name: 6. Upload Fuzzing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-fuzzing-results-${{ github.run_id }}
          path: |
            main/${{ steps.fuzz_ios.outputs.jpeg_dir }}
            main/${{ steps.fuzz_ios.outputs.log_path }}
            main/${{ steps.fuzz_ios.outputs.ndjson_path }}
            main/${{ steps.fuzz_ios.outputs.instr_path }}
            main/${{ steps.fuzz_ios.outputs.jpeg_mapping }}
