name: iOS JPEG Fuzzer Workflow

on:
  # This allows you to run the workflow manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  fuzz-and-log-ios:
    name: Generate Malicious JPEG and Log Simulator Response
    
    # --- THIS IS THE FIX ---
    # Use a standard, GitHub-provided macOS runner instead of a self-hosted one.
    runs-on: macos-latest

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4
        with:
          path: main

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python Dependencies
        run: pip install Pillow

      - name: 4. Generate Malicious JPEGs
        id: generate_jpegs
        working-directory: ./main
        run: |
          python MaliciousJPEGGenerator.py
          INFO_LEAK_FILE=$(ls malicious_jpegs/exploit_*.jpg | head -n 1)
          echo "jpeg_path=${INFO_LEAK_FILE}" >> "$GITHUB_OUTPUT"
          echo "output_dir=malicious_jpegs" >> "$GITHUB_OUTPUT"

      - name: 5. Fuzz Simulator and Capture Log
        id: fuzz_ios
        working-directory: ./main
        run: |
          set -e
          JPEG_PATH="${{ steps.generate_jpegs.outputs.jpeg_path }}"
          LOG_FILE="ios_simulator_crash.log"

          echo "--- Finding an available iPhone simulator ---"
          SIMULATOR_UDID=$(xcrun simctl list devices available -j | jq -r '.devices | .[] | .[] | select(.isAvailable == true and .name | startswith("iPhone")) | .udid' | head -n 1)
          
          if [ -z "$SIMULATOR_UDID" ]; then
            echo "::error::No available iPhone simulators found."
            exit 1
          fi
          
          echo "--- Booting simulator (UDID: ${SIMULATOR_UDID}) ---"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b

          echo "--- Uploading malicious file (${JPEG_PATH}) to the simulator's Photos library ---"
          xcrun simctl addmedia "$SIMULATOR_UDID" "$JPEG_PATH"

          echo "--- Starting system log capture... ---"
          timeout 20s xcrun simctl spawn "$SIMULATOR_UDID" log stream --predicate 'process == "MobileSlideShow" or eventType == crash' > "$LOG_FILE" &
          LOG_PID=$!
          
          sleep 5

          echo "--- Launching Photos app to trigger the file open ---"
          xcrun simctl launch "$SIMULATOR_UDID" com.apple.mobileslideshow

          echo "--- Waiting 15 seconds for potential crash to be logged ---"
          sleep 15

          echo "--- Stopping log capture ---"
          kill "$LOG_PID" 2>/dev/null || true

          echo "--- Shutting down the simulator ---"
          xcrun simctl shutdown "$SIMULATOR_UDID"

          echo "--- Log capture complete. Log content: ---"
          cat "$LOG_FILE"
          
          echo "log_path=${LOG_FILE}" >> "$GITHUB_OUTPUT"
          echo "jpeg_dir=${{ steps.generate_jpegs.outputs.output_dir }}" >> "$GITHUB_OUTPUT"

      - name: 6. Upload Fuzzing Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-fuzzing-results-${{ github.run_id }}
          path: |
            main/${{ steps.fuzz_ios.outputs.jpeg_dir }}
            main/${{ steps.fuzz_ios.outputs.log_path }}
