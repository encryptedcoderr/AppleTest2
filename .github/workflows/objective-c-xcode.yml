name: Fuzz Image Parser and Capture Log

on:
  # This allows you to run the workflow manually from the Actions tab in GitHub
  workflow_dispatch:

jobs:
  fuzz-and-log:
    name: Generate Malicious JPEG and Log System Response
    
    # This must run on a self-hosted macOS runner to interact with the GUI and system logs.
    runs-on: self-hosted

    steps:
      - name: 1. Checkout Repository
        uses: actions/checkout@v4

      - name: 2. Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install Pillow

      - name: 4. Generate Malicious JPEGs
        id: generate_jpeg
        run: |
          # Run your script to create the JPEGs in its output directory
          python MaliciousJPEGGenerator.py
          
          # Set the path to the specific info-leak JPEG as an output for the next step
          # Based on your script, the info-leak file is the first one generated (exploit_0.jpg)
          echo "jpeg_path=malicious_jpegs/exploit_0.jpg" >> "$GITHUB_OUTPUT"
          echo "output_dir=malicious_jpegs" >> "$GITHUB_OUTPUT"

      - name: 5. Capture System Log While Opening JPEG
        id: capture_log
        run: |
          JPEG_PATH="${{ steps.generate_jpeg.outputs.jpeg_path }}"
          LOG_FILE="system_crash_report.log"

          echo "--- Starting system log capture... ---"
          # Start the 'log stream' command in the background.
          # The predicate is crucial: it filters for logs from the Preview process
          # and any general crash reports from the system's launch daemon.
          # The command will run for a maximum of 20 seconds.
          timeout 20s log stream --predicate 'process == "Preview" or (subsystem == "com.apple.launchd" and composedMessage CONTAINS[c] "crashed")' > "$LOG_FILE" &
          LOG_PID=$!

          echo "--- Opening malicious JPEG with Preview.app to trigger a crash ---"
          # The 'open' command attempts to launch the JPEG in Preview.
          # We add a 'timeout' in case the application hangs instead of crashing.
          # The '|| true' ensures the workflow doesn't fail if the timeout is hit.
          timeout 10s open -a /System/Applications/Preview.app "$JPEG_PATH" || echo "Preview process finished or was timed out."

          # Wait a few seconds to ensure any final crash logs are written.
          sleep 5
          kill "$LOG_PID" 2>/dev/null || true # Cleanly stop the log stream process

          echo "--- Log capture complete. Log content: ---"
          cat "$LOG_FILE"
          
          # Set paths as outputs for the artifact upload step
          echo "log_path=${LOG_FILE}" >> "$GITHUB_OUTPUT"
          echo "jpeg_dir=${{ steps.generate_jpeg.outputs.output_dir }}" >> "$GITHUB_OUTPUT"

      - name: 6. Upload Fuzzing Artifacts
        if: always() # This ensures artifacts are uploaded even if a previous step fails
        uses: actions/upload-artifact@v4
        with:
          name: fuzzing-results-${{ github.run_id }}
          path: |
            ${{ steps.capture_log.outputs.jpeg_dir }}
            ${{ steps.capture_log.outputs.log_path }}
